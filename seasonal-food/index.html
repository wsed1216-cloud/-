<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가을 제철 음식 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3de;--ink:#5a3a22;--ac:#e8702a;--ok:#4fae5b;--line:#f0bf80;--soft:#ffe2b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2018;--ink:#ffeedd;--soft:#4a3626;--line:#8a6540}}
:root[data-theme="dark"]{--bg:#2b2018;--ink:#ffeedd;--soft:#4a3626;--line:#8a6540}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none;touch-action:manipulation}
#app{min-height:100%;display:flex;flex-direction:column;padding:12px 16px 20px}
button{font:inherit;color:inherit;cursor:pointer}
header{text-align:center;margin:6px 0 10px}h1{margin:0;font-size:clamp(26px,5vw,48px);color:var(--ac)}header p{margin:4px 0 0;font-size:clamp(16px,2.4vw,24px)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;max-width:1000px;width:100%;margin:8px auto}
.mb{background:#fffaf0;color:#5a3a22;border:4px solid var(--line);border-radius:26px;padding:16px 10px;font-size:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line)}
.mb b{font-size:46px;font-weight:400}.mb:active,.btn:active{transform:translateY(3px)}
.set{max-width:1000px;width:100%;margin:10px auto;background:var(--soft);border-radius:22px;padding:12px 16px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:20px}.row>span{min-width:84px}
.seg{border:3px solid var(--line);background:#fffaf0;color:#5a3a22;border-radius:16px;padding:8px 18px;font-size:20px}.seg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.top h2{margin:0;font-size:clamp(22px,3.4vw,36px)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:18px;padding:10px 20px;font-size:22px;box-shadow:0 4px 0 #b4501a}.btn.sm{padding:8px 14px;font-size:19px}
#pg{font-size:24px;background:var(--soft);border-radius:14px;padding:6px 14px}
#st{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:10px;position:relative}
.ask{font-size:clamp(22px,3.4vw,38px);text-align:center;margin:0}
.card{background:#fffaf0;color:#5a3a22;border:4px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
button.card:active{transform:scale(.97)}
.card img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.grid{display:grid;gap:14px;width:100%;max-width:900px;justify-content:center}
.ch{height:clamp(110px,22vh,210px)}.big{height:clamp(150px,30vh,300px);width:min(70vw,420px)}
.txt{font-size:clamp(26px,4vw,46px);height:clamp(80px,14vh,120px)}
.two{display:flex;gap:min(14vw,120px);justify-content:center}.col{display:flex;flex-direction:column;gap:12px}.col .card{width:min(32vw,260px);height:clamp(80px,15vh,150px)}
.sel{border-color:var(--ac);box-shadow:0 0 0 6px #e8702a55}.done{border-color:var(--ok);box-shadow:0 0 0 6px #4fae5b66;opacity:.8;pointer-events:none}
.shake{animation:sk .45s}@keyframes sk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.dg{touch-action:none}.hint{height:70%!important;width:auto;max-width:42%}.txt{gap:10px}.two{position:relative}.two svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.num{font-size:clamp(50px,9vw,110px)}
.fl{flex-direction:column;gap:4px;font-size:clamp(18px,2.6vw,30px);height:clamp(110px,21vh,190px)}.fl img{max-height:68%}.back{font-size:56px;color:var(--ac)}
.rain{width:100%;height:58vh;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#ffe9c9,#fff6e6)}
.fc{position:absolute;top:-160px;width:clamp(90px,13vw,140px);height:clamp(80px,12vw,125px);padding:6px;animation:fall linear forwards}@keyframes fall{to{top:100%}}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.slots .card{width:clamp(90px,16vw,170px);height:clamp(80px,14vh,140px)}.slots .e{border-style:dashed;background:transparent}
.pz{display:grid;gap:3px;border:4px solid var(--line);border-radius:14px;overflow:hidden;background:#fffaf0}.pz>div{background-color:var(--soft);cursor:pointer}
.pp{border:4px solid var(--line);border-radius:10px;background-color:#fffaf0;cursor:pointer}.tray{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.ov span{position:absolute;top:-60px;font-size:44px;animation:fall 1.7s ease-in forwards}
.msg{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:clamp(40px,9vw,96px);color:var(--ac);text-shadow:0 4px 0 #fff;z-index:10;pointer-events:none;animation:pop .6s}@keyframes pop{from{transform:scale(.3);opacity:0}}
.fin{text-align:center;display:grid;gap:14px;justify-items:center}.fin div{font-size:90px}
.cr{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.55;pointer-events:none;z-index:5}</style></head><body><div id="app"></div><div class="cr">© 예진짱짱걸</div>

const img=x=>`<img src="${x.img}" alt="${x.n}">`;
function drag(e,el,drop){e.preventDefault();const r=el.getBoundingClientRect(),g=el.cloneNode(true);g.style.cssText+=`;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:20;pointer-events:none;opacity:.92;transform:scale(1.08)`;document.body.append(g);el.style.opacity=.3;
 const dx=e.clientX-r.left,dy=e.clientY-r.top,mv=v=>{g.style.left=v.clientX-dx+'px';g.style.top=v.clientY-dy+'px'},up=v=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();el.style.opacity=1;const u=document.elementFromPoint(v.clientX,v.clientY);if(drop(u)===false)oops(u&&(u.closest('.card,.pz>div')||u))};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
const G={
pairs(){run('pairs','같은 그림 연결하기',done=>{const k=[3,4,5][S.lv],a=shf(pool()).slice(0,k);let left=k,dr=null;
 const col=s=>shf(a).map(x=>`<button class="card dg" data-s="${s}" data-id="${x.id}">${img(x)}</button>`).join('');
 st().innerHTML=ask('같은 그림끼리 선으로 이어 보세요')+`<div class="two" id="tw"><div class="col">${col('L')}</div><div class="col">${col('R')}</div><svg id="ln"></svg></div>`;
 const tw=$('#tw'),sv=$('#ln'),NS='http://www.w3.org/2000/svg';
 const pt=b=>{const r=b.getBoundingClientRect(),o=tw.getBoundingClientRect();return [(b.dataset.s=='L'?r.right:r.left)-o.left,r.top+r.height/2-o.top]};
 const mk=(p,c)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',p[0]);l.setAttribute('y2',p[1]);l.setAttribute('stroke',c);l.setAttribute('stroke-width',10);l.setAttribute('stroke-linecap','round');sv.append(l);return l};
 const to=(l,x,y)=>{l.setAttribute('x2',x);l.setAttribute('y2',y)};
 tw.onpointerdown=e=>{const b=e.target.closest('button.card');if(!b||b.classList.contains('done'))return;e.preventDefault();tw.setPointerCapture(e.pointerId);b.classList.add('sel');dr={b,l:mk(pt(b),'#e8702a')}};
 tw.onpointermove=e=>{if(!dr)return;const o=tw.getBoundingClientRect();to(dr.l,e.clientX-o.left,e.clientY-o.top)};
 tw.onpointerup=tw.onpointercancel=e=>{if(!dr)return;const {b,l}=dr;dr=null;b.classList.remove('sel');const u=document.elementFromPoint(e.clientX,e.clientY),c=u&&u.closest('button.card');
  if(c&&c!=b&&c.dataset.s!=b.dataset.s&&!c.classList.contains('done')){if(c.dataset.id==b.dataset.id){const p=pt(c);to(l,p[0],p[1]);l.setAttribute('stroke','#4fae5b');b.classList.add('done');c.classList.add('done');say(a.find(x=>x.id==b.dataset.id).n);if(!--left)setTimeout(()=>win(done),900);return}oops(c)}
  l.remove()}})},

shadow(){run('shadow','그림자 찾기',done=>{const p=pool(1),t=p[R(p.length)],o=shf([t,...shf(p.filter(x=>x!=t)).slice(0,nOpt()-1)]);
 st().innerHTML=ask('그림자를 보고 알맞은 그림을 찾아 보세요')+`<div class="card big"><img id="bg" src="${t.sh}"></div><div class="grid" style="grid-template-columns:repeat(${Math.min(o.length,3)},minmax(0,1fr))">${o.map(x=>`<button class="card ch" data-id="${x.id}">${img(x)}</button>`).join('')}</div>`;
 st().onclick=e=>{const b=e.target.closest('button.card');if(!b)return;if(b.dataset.id==t.id){$('#bg').src=t.img;win(done,t.n+'! 잘했어요!')}else oops(b)}})},
odd(){run('odd','다른 것 하나 찾기',done=>{const n=[4,6,9][S.lv],c=n==4?2:3,num=0,odd=R(n);let A,B;
 if(num){A=R(10);do B=R(10);while(B==A);A=''+A;B=''+B}else{[A,B]=shf(pool()).slice(0,2)}
 st().innerHTML=ask('다른 것 하나를 찾아 보세요')+`<div class="grid" style="grid-template-columns:repeat(${c},minmax(0,1fr));max-width:${c*230}px">${Array.from({length:n},(_,i)=>{const v=i==odd?B:A;return `<button class="card ch ${num?'num':''}" data-o="${i==odd?1:0}">${num?v:img(v)}</button>`}).join('')}</div>`;
 st().onclick=e=>{const b=e.target.closest('button.card');if(!b)return;if(b.dataset.o==1){b.classList.add('done');win(done,'맞아요! 다른 것을 찾았어요!')}else oops(b)}})},
rain(){run('rain','그림카드 우수수',done=>{const p=pool(),t=p[R(p.length)],dur=[8,6,4.5][S.lv];let got=0;
 st().innerHTML=ask(eul(t.n)+' 3개 찾아서 눌러 보세요')+`<div style="display:flex;gap:20px;align-items:center"><div class="card" style="height:clamp(80px,14vh,130px);width:clamp(110px,20vw,190px)">${img(t)}</div><div id="stars" style="font-size:44px">☆☆☆</div></div><div class="rain" id="rn"></div>`;
 const sp=()=>{const w=Math.random()<.4?t:shf(p.filter(x=>x!=t))[0],d=document.createElement('button');d.className='card fc';d.innerHTML=img(w);d.style.left=(2+R(80))+'%';d.style.animationDuration=dur+'s';d.onanimationend=()=>d.remove();
  d.onclick=()=>{if(w==t){d.remove();got++;$('#stars').textContent='⭐'.repeat(got)+'☆'.repeat(3-got);if(got>=3)win(done,t.n+'! 잘했어요!');else say(t.n+' '+got+'개!')}else oops(d)};$('#rn').append(d)};
 sp();T=setInterval(sp,[1300,1000,750][S.lv])})},

flip(){run('flip','단어카드 펼치기',done=>{const k=[6,8,12][S.lv],a=shf(pool()).slice(0,k),c=k==6?3:4;let open=0;
 st().innerHTML=ask('카드를 눌러서 펼쳐 보세요')+`<div class="grid" style="grid-template-columns:repeat(${c},minmax(0,1fr));max-width:${c*230}px">${a.map(x=>`<button class="card fl" data-i="${x.id}"><span class="back">?</span></button>`).join('')}</div>`;
 st().onclick=e=>{const b=e.target.closest('button.card');if(!b)return;const x=a.find(y=>y.id==b.dataset.i);if(!b.dataset.o){b.dataset.o=1;open++;b.innerHTML=img(x)+`<span>${x.n}</span>`;b.classList.add('done');if(open==k){say('제철 음식 한 상이 완성되었어요!');setTimeout(()=>win(done,'한 상 완성!'),1200)}else say(x.n)}}},1)},
order(){run('order','똑같이 배열하기',done=>{const k=[3,4,5][S.lv],a=shf(pool()).slice(0,k);let fill=0;
 st().innerHTML=ask('아래 그림을 끌어서 빈 칸에 똑같이 놓아 보세요')+`<div class="slots">${a.map(x=>`<div class="card">${img(x)}</div>`).join('')}</div><div class="slots" id="sl">${a.map(()=>'<div class="card e"></div>').join('')}</div><div class="slots" id="tr">${shf(a).map(x=>`<button class="card dg" data-id="${x.id}">${img(x)}</button>`).join('')}</div>`;
 $('#tr').onpointerdown=e=>{const b=e.target.closest('button');if(!b)return;drag(e,b,u=>{const s=u&&u.closest('#sl .e');if(!s)return null;const i=[...$('#sl').children].indexOf(s);if(b.dataset.id!=a[i].id)return false;s.classList.remove('e');s.innerHTML=b.innerHTML;b.style.visibility='hidden';b.style.pointerEvents='none';say(a[i].n);if(++fill==k)setTimeout(()=>win(done),700);return true})}})},

words(){run('words','같은 단어 모두 찾기',done=>{const p=pool(),t=p[R(p.length)],m=[2,3,3][S.lv],n=[4,6,9][S.lv],c=n==4?2:3;let f=0;
 const ws=shf([...Array(m).fill(t),...shf(p.filter(x=>x!=t)).slice(0,n-m)]);
 st().innerHTML=ask(eul(t.n)+' 모두 찾아 눌러 보세요')+`<div class="card" style="height:clamp(110px,22vh,200px);width:min(60vw,320px)">${img(t)}</div><div class="grid" style="grid-template-columns:repeat(${c},minmax(0,1fr));max-width:${c*260}px">${ws.map(w=>`<button class="card txt" data-w="${w.n}">${S.lv==0?`<img class="hint" src="${w.img}" alt="">`:''}${w.n}</button>`).join('')}</div>`;
 st().onclick=e=>{const b=e.target.closest('button.card.txt');if(!b||b.classList.contains('done'))return;if(b.dataset.w==t.n){b.classList.add('done');say(t.n);if(++f==m)setTimeout(()=>win(done,'모두 찾았어요!'),800)}else oops(b)}})},

puzzle(){run('puzzle','그림 퍼즐',done=>{const p=pool(),t=p[R(p.length)],[c,r]=[[2,1],[2,2],[3,2]][S.lv],im=new Image();
 im.onload=()=>{const W=Math.min(innerWidth*.6,520),ar=im.naturalWidth/im.naturalHeight,H=W/ar,pw=Math.min(150,W/c*.7);let left=c*r;
  const bg=i=>{const x=i%c,y=(i/c)|0;return `background-image:url(${t.img});background-repeat:no-repeat;background-size:${c*100}% ${r*100}%;background-position:${c>1?x*100/(c-1):0}% ${r>1?y*100/(r-1):0}%`};
  st().innerHTML=ask('조각을 끌어서 알맞은 자리에 놓아 보세요')+`<div class="pz" id="pz" style="width:${W}px;height:${H}px;grid-template-columns:repeat(${c},1fr);grid-template-rows:repeat(${r},1fr)">${Array.from({length:c*r},(_,i)=>`<div data-i="${i}"></div>`).join('')}</div><div class="tray" id="tr">${shf([...Array(c*r).keys()]).map(i=>`<div class="pp dg" data-i="${i}" style="width:${pw}px;aspect-ratio:${(im.naturalWidth/c)/(im.naturalHeight/r)};${bg(i)}"></div>`).join('')}</div>`;
  $('#tr').onpointerdown=e=>{const pp=e.target.closest('.pp');if(!pp)return;drag(e,pp,u=>{const sl=u&&u.closest('#pz>div');if(!sl||sl.dataset.f)return null;if(sl.dataset.i!=pp.dataset.i)return false;sl.dataset.f=1;sl.style.cssText=bg(+sl.dataset.i);pp.remove();if(!--left){say(t.n);setTimeout(()=>win(done,t.n+'! 완성!'),900)}return true})}};
 im.src=t.img},Math.min(S.q,3))}};

const M=[['pairs','🔗','같은 그림 연결하기'],['shadow','🌑','그림자 찾기'],['odd','🔎','다른 것 하나 찾기'],['rain','🍂','그림카드 우수수'],['flip','🃏','단어카드 펼치기'],['order','🧺','똑같이 배열하기'],['words','🔤','같은 단어 모두 찾기'],['puzzle','🧩','그림 퍼즐']];
const O=[['lv','놀이 수준',[['쉬움',0],['보통',1],['어려움',2]]],['q','문제 수',[['3',3],['5',5],['8',8]]],['pool','그림',[['음식','f'],['식재료','i'],['전체','all']]],['say','음성 안내',[['켜짐',1],['꺼짐',0]]]];
function setUI(){$('#set').innerHTML=O.map(([k,l,v])=>`<div class="row"><span>${l}</span>${v.map(([n,x])=>`<button class="seg ${S[k]==x?'on':''}" data-k="${k}" data-v="${x}">${n}</button>`).join('')}</div>`).join('')+`<div class="row"><button class="seg" onclick="(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})">⛶ 전체 화면</button></div>`}
function home(){clearInterval(T);try{speechSynthesis.cancel()}catch(e){}
 app.innerHTML=`<header><h1>🍁 가을 제철 음식 놀이터 🍠</h1><p>하고 싶은 놀이를 눌러 보세요!</p></header><div class="menu">${M.map(([k,e,n])=>`<button class="mb" onclick="G.${k}()"><b>${e}</b>${n}</button>`).join('')}</div><div class="set" id="set"></div>`;
 setUI();$('#set').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;S[k]=isNaN(v)?v:+v;try{localStorage.setItem('fs',JSON.stringify(S))}catch(x){}setUI()}}
const app=$('#app');home();
</script></body></html>
